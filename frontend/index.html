<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniplink — URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text: #f1f1f4;
            --text-dim: #71717a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --purple: #a855f7;
            --radius: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .noise {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px;
            pointer-events: none;
            z-index: 0;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.12);
            top: -150px;
            left: -100px;
            animation: float1 20s ease-in-out infinite;
        }

        .glow-2 {
            width: 400px;
            height: 400px;
            background: rgba(168, 85, 247, 0.1);
            bottom: -100px;
            right: -80px;
            animation: float2 25s ease-in-out infinite;
        }

        .glow-3 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float3 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(40px, 30px); }
            66% { transform: translate(-20px, 50px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-30px, -40px); }
            66% { transform: translate(50px, -20px); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-light), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto;
        }

        .shortener-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s ease;
        }

        .shortener-card:focus-within {
            border-color: var(--border-focus);
        }

        .input-group {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px 0 12px;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        #url-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            padding: 12px 8px;
            min-width: 0;
        }

        #url-input::placeholder {
            color: var(--text-dim);
        }

        #submit-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        #submit-btn:hover {
            opacity: 0.9;
        }

        #submit-btn:active {
            transform: scale(0.97);
        }

        #submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loader {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 0.875rem;
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }

        .result-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 4px 4px 16px;
        }

        .result-url {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent-light);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: all;
            min-width: 0;
        }

        .copy-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .copy-btn.copied {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        footer {
            margin-top: auto;
            padding-top: 48px;
            width: 100%;
            text-align: center;
        }

        footer p {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            .container {
                padding: 48px 16px 32px;
            }

            .shortener-card {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
                padding: 8px;
            }

            .input-icon {
                display: none;
            }

            #url-input {
                width: 100%;
                padding: 12px;
            }

            #submit-btn {
                width: 100%;
                padding: 14px;
                margin-top: 4px;
            }

            .result-row {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .result-url {
                text-align: center;
                padding-bottom: 8px;
            }

            .copy-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <main class="container">
        <header class="hero">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="12" fill="url(#logo-grad)"/>
                    <path d="M14 20.5L18 24.5L26 16.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 16H26V20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#a855f7"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">Sniplink</span>
            </div>
            <h1>Shorten any link,<br><span class="gradient-text">share it instantly.</span></h1>
            <p class="subtitle">Paste a long URL, get a clean short link. Fast, free, and simple.</p>
        </header>

        <section class="shortener-card">
            <form id="shorten-form" autocomplete="off">
                <div class="input-group">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                    </div>
                    <input
                        type="url"
                        id="url-input"
                        placeholder="Paste your long URL here..."
                        required
                        spellcheck="false"
                    >
                    <button type="submit" id="submit-btn">
                        <span class="btn-text">Shorten</span>
                        <span class="btn-loader" hidden>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            </svg>
                        </span>
                    </button>
                </div>
                <div id="error-msg" class="error-msg" hidden></div>
            </form>

            <div id="result" class="result" hidden>
                <div class="result-label">Your shortened link</div>
                <div class="result-row">
                    <div class="result-url" id="short-url"></div>
                    <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
                        <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span class="copy-label">Copy</span>
                    </button>
                </div>
            </div>
        </section>

        <footer>
            <p>Built with Go + Redis</p>
        </footer>
    </main>

    <script>
        const form = document.getElementById('shorten-form');
        const input = document.getElementById('url-input');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoader = submitBtn.querySelector('.btn-loader');
        const errorMsg = document.getElementById('error-msg');
        const result = document.getElementById('result');
        const shortUrl = document.getElementById('short-url');
        const copyBtn = document.getElementById('copy-btn');
        const copyIcon = copyBtn.querySelector('.copy-icon');
        const checkIcon = copyBtn.querySelector('.check-icon');
        const copyLabel = copyBtn.querySelector('.copy-label');

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.hidden = loading;
            btnLoader.hidden = !loading;
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.hidden = false;
        }

        function hideError() {
            errorMsg.hidden = true;
        }

        function showResult(url) {
            shortUrl.textContent = url;
            result.hidden = false;
            copyBtn.classList.remove('copied');
            copyIcon.hidden = false;
            checkIcon.hidden = true;
            copyLabel.textContent = 'Copy';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const url = input.value.trim();
            if (!url) return;

            try {
                new URL(url);
            } catch {
                showError('Please enter a valid URL including http:// or https://');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });

                const text = await res.text();

                if (!res.ok) {
                    throw new Error(text.trim() || 'Server error (' + res.status + ')');
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    throw new Error('Invalid response from server');
                }

                if (!data.short_url) {
                    throw new Error('No short URL in response');
                }

                showResult(data.short_url);
            } catch (err) {
                showError(err.message || 'Something went wrong. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        copyBtn.addEventListener('click', async () => {
            const url = shortUrl.textContent;
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyBtn.classList.add('copied');
            copyIcon.hidden = true;
            checkIcon.hidden = false;
            copyLabel.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyIcon.hidden = false;
                checkIcon.hidden = true;
                copyLabel.textContent = 'Copy';
            }, 2000);
        });

        input.addEventListener('input', hideError);
    </script>
</body>
</html>
